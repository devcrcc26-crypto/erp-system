# Render Blueprint — Construction ERP backend API
# Docs: https://render.com/docs/blueprint-spec
#
# Stack: Render (this service) + Neon (Postgres) + Vercel (frontend) + Resend (email)
#
# Setup:
#   1. Connect this repo in Render → New → Blueprint → use this file
#   2. Set secret env vars in the Render dashboard (sync: false keys below)
#   3. Deploy Vercel frontend separately (see frontend/vercel.json)
#   4. Set CORS_ORIGIN + FRONTEND_URL to your Vercel production URL
#   5. Set NEXT_PUBLIC_API_URL on Vercel to https://<this-service>.onrender.com/api
#
# First deploy only (Render Shell, after migrations succeed):
#   npm run db:seed --workspace=backend
#   # Or baseline-only: SEED_PM_DEMO=false npm run db:seed --workspace=backend

services:
  - type: web
    name: construction-erp-api
    runtime: node
    region: oregon
    plan: starter
    branch: main

    # Monorepo: install from repo root (npm workspaces + root package-lock.json)
    buildCommand: npm ci && npm run build --workspace=backend
    startCommand: npm run start:prod --workspace=backend
    preDeployCommand: npm run db:migrate:deploy --workspace=backend

    healthCheckPath: /api/health

    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - render.yaml

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_PREFIX
        value: api

      # Set to your Vercel production URL (no trailing slash)
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      - key: THROTTLE_LIMIT
        value: "300"

      # Neon pooled connection string (?sslmode=require recommended)
      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Enable when Render Redis / Upstash is configured
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"

      # Object storage — point Minio client at S3-compatible host in production
      - key: STORAGE_PROVIDER
        value: minio
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_USE_SSL
        value: "true"

      # Resend SMTP: smtp.resend.com:587 (configure auth in mail module if needed)
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_FROM
        sync: false

      - key: NOTIFICATION_RETENTION_DAYS
        value: "90"
